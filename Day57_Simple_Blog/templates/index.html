<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Name Card</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card">
        <div class="avatar">
            <img src="{{ url_for('static', filename='images/profile.jpg') }}" alt="Profile Photo">
        </div>
        <div class="info">
            <h1>Hacker</h1>
            <p>Cybersecurity Enthusiast | Python Developer</p>
            <div class="social-links">
                <a href="#">GitHub</a>
                <a href="#">LinkedIn</a>
                <a href="#">Twitter</a>
            </div>
        </div>
    </div>
</body>
</html>
